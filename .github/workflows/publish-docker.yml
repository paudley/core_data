name: Publish Docker Image to GHCR

on:
  push:
    tags:
      - '*-v*.*.*'  # Matches hybrid tags like 17.2-v1.0.0
      - 'v*.*.*'    # Also matches simple semantic tags like v1.0.0

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/postgres

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for proper versioning

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version information
        id: version
        run: |
          # Get the tag name
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT

          # Extract PostgreSQL version and semantic version from hybrid tag
          # Example: 17.2-v1.0.0 -> PG_VERSION=17.2, SEM_VERSION=1.0.0
          if [[ $TAG_NAME =~ ^([0-9]+\.[0-9]+)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            PG_VERSION="${BASH_REMATCH[1]}"
            SEM_VERSION="${BASH_REMATCH[2]}"
            PG_MAJOR="${PG_VERSION%%.*}"
            SEM_MAJOR="${SEM_VERSION%%.*}"
            SEM_MINOR="${SEM_VERSION%.*}"

            echo "pg_version=${PG_VERSION}" >> $GITHUB_OUTPUT
            echo "pg_major=${PG_MAJOR}" >> $GITHUB_OUTPUT
            echo "sem_version=${SEM_VERSION}" >> $GITHUB_OUTPUT
            echo "sem_major=${SEM_MAJOR}" >> $GITHUB_OUTPUT
            echo "sem_minor=${SEM_MINOR}" >> $GITHUB_OUTPUT
            echo "is_hybrid=true" >> $GITHUB_OUTPUT
          else
            echo "is_hybrid=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # For hybrid tags (17.2-v1.0.0), create multiple tags
            type=raw,value=${{ steps.version.outputs.tag }},enable=${{ steps.version.outputs.is_hybrid == 'true' }}
            type=raw,value=${{ steps.version.outputs.pg_version }}-v${{ steps.version.outputs.sem_minor }},enable=${{ steps.version.outputs.is_hybrid == 'true' }}
            type=raw,value=${{ steps.version.outputs.pg_version }}-v${{ steps.version.outputs.sem_major }},enable=${{ steps.version.outputs.is_hybrid == 'true' }}
            type=raw,value=${{ steps.version.outputs.pg_version }},enable=${{ steps.version.outputs.is_hybrid == 'true' }}
            type=raw,value=${{ steps.version.outputs.pg_major }},enable=${{ steps.version.outputs.is_hybrid == 'true' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.is_hybrid == 'true' }}
            # For simple semantic tags (v1.0.0)
            type=semver,pattern={{version}},enable=${{ steps.version.outputs.is_hybrid == 'false' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.version.outputs.is_hybrid == 'false' }}
            type=semver,pattern={{major}},enable=${{ steps.version.outputs.is_hybrid == 'false' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.is_hybrid == 'false' }}
          labels: |
            org.opencontainers.image.title=Core Data PostgreSQL
            org.opencontainers.image.description=PostgreSQL 17 with extensive extensions for spatial, vector, and graph data
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./postgres/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PG_VERSION=${{ steps.version.outputs.pg_major || '17' }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Attest SBOM
        uses: actions/attest-sbom@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cyclonedx.json
          push-to-registry: true

      - name: Output image information
        run: |
          echo "### 🐳 Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Verify attestation:**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "gh attestation verify oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }} --owner ${{ github.repository_owner }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull image:**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
