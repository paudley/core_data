x-logging-default: &logging_defaults
  driver: local
  options:
    max-size: ${POSTGRES_LOG_MAX_SIZE:-10m}
    max-file: "${POSTGRES_LOG_MAX_FILE:-5}"
    mode: ${POSTGRES_LOG_MODE:-non-blocking}
    max-buffer-size: ${POSTGRES_LOG_BUFFER:-25m}
    compress: "true"

x-security-defaults: &security_defaults
  cap_drop:
    - ALL

services:
  network_probe:
    build:
      context: .
      dockerfile: docker/network-probe/Dockerfile
    image: ${NETWORK_PROBE_IMAGE:-ghcr.io/paudley/core_data/network-probe:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-core_data}_network_probe
    restart: "no"
    network_mode: host
    environment:
      DOCKER_NETWORK_SUBNET: ${DOCKER_NETWORK_SUBNET}
      NETWORK_DIR: /opt/core_data/network_access
    entrypoint: ["/opt/core_data/scripts/network_probe.sh"]
    volumes:
      - ./network_access:/opt/core_data/network_access
      - ./scripts/network_probe.sh:/opt/core_data/scripts/network_probe.sh:ro

  volume_prep:
    image: ${POSTGRES_IMAGE_NAME:-core_data/postgres}:${POSTGRES_IMAGE_TAG:-17.2-bookworm-core}
    container_name: ${COMPOSE_PROJECT_NAME:-core_data}_volume_prep
    restart: "no"
    # Runs as root briefly to fix ownership; uses Docker's default capabilities.
    user: "0:0"
    depends_on:
      network_probe:
        condition: service_completed_successfully
    environment:
      PGDATA_MOUNT: ${POSTGRES_DATA_MOUNT_PATH:-/var/lib/postgresql/data}
      PGWAL_MOUNT: ${POSTGRES_WAL_MOUNT_PATH:-/var/lib/postgresql/wal}
      PGBACKREST_MOUNT: ${POSTGRES_BACKREST_MOUNT_PATH:-/var/lib/pgbackrest}
      RABBITMQ_DATA_MOUNT: ${RABBITMQ_DATA_MOUNT_PATH:-/var/lib/rabbitmq}
      # Service UIDs/GIDs - must match the user baked into each pre-built image
      POSTGRES_UID: ${POSTGRES_UID:-1000}
      POSTGRES_GID: ${POSTGRES_GID:-1000}
      RABBITMQ_UID: ${RABBITMQ_UID:-100}
      RABBITMQ_GID: ${RABBITMQ_GID:-101}
      # Shared secrets group - all containers have this as a secondary group
      SECRETS_GID: ${SECRETS_GID:-65532}
      SECRETS_MOUNT: /opt/core_data/secrets
    command:
      - "/bin/sh"
      - "-c"
      - |
        # Fix ownership for data directories
        chown -R $${POSTGRES_UID}:$${POSTGRES_GID} $${PGDATA_MOUNT} $${PGWAL_MOUNT} $${PGBACKREST_MOUNT}
        chown -R $${RABBITMQ_UID}:$${RABBITMQ_GID} $${RABBITMQ_DATA_MOUNT}
        # Fix group ownership for secrets - keep original owner, set group to secrets
        # All service containers have the secrets group as a secondary group
        chgrp $${SECRETS_GID} $${SECRETS_MOUNT}/* 2>/dev/null || true
        chmod 640 $${SECRETS_MOUNT}/* 2>/dev/null || true
        # Ensure secrets directory is traversable by all services (711 = rwx--x--x)
        chmod 711 $${SECRETS_MOUNT} 2>/dev/null || true
    volumes:
      - ./data/postgres_data:${POSTGRES_DATA_MOUNT_PATH:-/var/lib/postgresql/data}
      - ./data/postgres_wal:${POSTGRES_WAL_MOUNT_PATH:-/var/lib/postgresql/wal}
      - ./data/pgbackrest:${POSTGRES_BACKREST_MOUNT_PATH:-/var/lib/pgbackrest}
      - ./data/rabbitmq_data:${RABBITMQ_DATA_MOUNT_PATH:-/var/lib/rabbitmq}
      - ./secrets:/opt/core_data/secrets
    networks:
      - core_data
    logging: *logging_defaults

  network_guard:
    build:
      context: .
      dockerfile: docker/network-guard/Dockerfile
    image: ${NETWORK_GUARD_IMAGE:-ghcr.io/paudley/core_data/network-guard:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-core_data}_network_guard
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    depends_on:
      network_probe:
        condition: service_completed_successfully
    environment:
      NETWORK_DIR: /opt/core_data/network_access
      CHECK_INTERVAL: ${NETWORK_GUARD_CHECK_INTERVAL:-30}
      SERVICES: "${POSTGRES_PORT:-5433} ${PGHERO_PORT:-8080} ${PGBOUNCER_HOST_PORT:-6432} ${PGBOUNCER_EXTRA_HOST_PORT:-5432} ${VALKEY_HOST_PORT:-6379} ${RABBITMQ_HOST_PORT:-5672} ${RABBITMQ_MANAGEMENT_HOST_PORT:-15672} ${MEMCACHED_PORT:-11211}"
    entrypoint: ["/opt/core_data/scripts/network_guard.sh"]
    volumes:
      - ./network_access:/opt/core_data/network_access:ro
      - ./scripts/network_guard.sh:/opt/core_data/scripts/network_guard.sh:ro

  postgres:
    <<: *security_defaults
    security_opt:
      - "no-new-privileges:true"
      - "${CORE_DATA_SECCOMP_POSTGRES:-seccomp:./seccomp/postgres.json}"
      - "${CORE_DATA_APPARMOR_POSTGRES:-apparmor:unconfined}"
    image: ${POSTGRES_IMAGE_NAME:-core_data/postgres}:${POSTGRES_IMAGE_TAG:-17.2-bookworm-core}
    container_name: ${COMPOSE_PROJECT_NAME:-core_data}_postgres
    restart: unless-stopped
    # group_add adds the secrets group as a supplementary group for reading shared secrets
    group_add:
      - "${SECRETS_GID:-65532}"
    environment:
      # PGPORT ensures Docker's init-time postgres starts on 5433 so init scripts
      # can connect on the same port as the final production configuration.
      # Container port is always 5433; host port can vary via POSTGRES_PORT.
      PGPORT: "5433"
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      POSTGRES_SUPERUSER_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASES_TO_CREATE: ${DATABASES_TO_CREATE}
      PGBOUNCER_AUTH_USER: ${PGBOUNCER_AUTH_USER}
      PGBOUNCER_STATS_USER: ${PGBOUNCER_STATS_USER}
      TZ: ${TZ}
      POSTGRES_LISTEN_ADDRESSES: ${POSTGRES_LISTEN_ADDRESSES}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS}
      PG_SHARED_BUFFERS: ${PG_SHARED_BUFFERS}
      PG_EFFECTIVE_CACHE_SIZE: ${PG_EFFECTIVE_CACHE_SIZE}
      PG_WORK_MEM: ${PG_WORK_MEM}
      PG_MAINTENANCE_WORK_MEM: ${PG_MAINTENANCE_WORK_MEM}
      PG_RANDOM_PAGE_COST: ${PG_RANDOM_PAGE_COST}
      PG_EFFECTIVE_IO_CONCURRENCY: ${PG_EFFECTIVE_IO_CONCURRENCY}
      PG_MAX_WAL_SIZE: ${PG_MAX_WAL_SIZE}
      PG_MIN_WAL_SIZE: ${PG_MIN_WAL_SIZE}
      PG_WAL_KEEP_SIZE: ${PG_WAL_KEEP_SIZE}
      PG_MAX_WAL_SENDERS: ${PG_MAX_WAL_SENDERS}
      PG_CHECKPOINT_COMPLETION_TARGET: ${PG_CHECKPOINT_COMPLETION_TARGET}
      PG_LOG_MIN_DURATION_STATEMENT: ${PG_LOG_MIN_DURATION_STATEMENT}
      # Transaction pooling optimizations
      PG_PLAN_CACHE_MODE: ${PG_PLAN_CACHE_MODE:-auto}
      PG_JIT_ENABLED: ${PG_JIT_ENABLED:-on}
      PG_JIT_ABOVE_COST: ${PG_JIT_ABOVE_COST:-100000}
      PG_MAX_PARALLEL_WORKERS_PER_GATHER: ${PG_MAX_PARALLEL_WORKERS_PER_GATHER:-4}
      PG_MAX_PARALLEL_WORKERS: ${PG_MAX_PARALLEL_WORKERS:-8}
      PG_PARALLEL_TUPLE_COST: ${PG_PARALLEL_TUPLE_COST:-0.01}
      PG_PARALLEL_SETUP_COST: ${PG_PARALLEL_SETUP_COST:-1000}
      PG_TCP_KEEPALIVES_IDLE: ${PG_TCP_KEEPALIVES_IDLE:-60}
      PG_TCP_KEEPALIVES_INTERVAL: ${PG_TCP_KEEPALIVES_INTERVAL:-10}
      PG_TCP_KEEPALIVES_COUNT: ${PG_TCP_KEEPALIVES_COUNT:-6}
      PG_IDLE_SESSION_TIMEOUT: ${PG_IDLE_SESSION_TIMEOUT:-0}
      PG_TEMP_FILE_LIMIT: ${PG_TEMP_FILE_LIMIT:--1}
      POSTGRES_SSL_ENABLED: ${POSTGRES_SSL_ENABLED}
      POSTGRES_SSL_CERT_FILE: ${POSTGRES_SSL_CERT_FILE}
      POSTGRES_SSL_KEY_FILE: ${POSTGRES_SSL_KEY_FILE}
      POSTGRES_SSL_SELF_SIGNED_SUBJECT: ${POSTGRES_SSL_SELF_SIGNED_SUBJECT}
      POSTGRES_SSL_SELF_SIGNED_DAYS: ${POSTGRES_SSL_SELF_SIGNED_DAYS}
      POSTGRES_INITDB_WALDIR: /var/lib/postgresql/wal
    volumes:
      - ./data/postgres_data:${POSTGRES_DATA_MOUNT_PATH:-/var/lib/postgresql/data}
      - ./data/postgres_wal:${POSTGRES_WAL_MOUNT_PATH:-/var/lib/postgresql/wal}
      - ./data/pgbackrest:${POSTGRES_BACKREST_MOUNT_PATH:-/var/lib/pgbackrest}
      - ${BACKUPS_HOST_PATH:-./backups}:/backups
      - ./postgres/conf:/opt/core_data/conf:ro
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./scripts:/opt/core_data/scripts:ro
      - ./network_access:/opt/core_data/network_access:ro
      - ./secrets/postgres_superuser_password:/run/secrets/postgres_superuser_password:ro
      - ./secrets/pgbouncer_auth_password:/run/secrets/pgbouncer_auth_password:ro
      - ./secrets/pgbouncer_stats_password:/run/secrets/pgbouncer_stats_password:ro
    networks:
      - core_data
    depends_on:
      network_probe:
        condition: service_completed_successfully
      network_guard:
        condition: service_started
      volume_prep:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "/opt/core_data/scripts/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    stop_grace_period: 1m
    shm_size: ${POSTGRES_SHM_SIZE:-0}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-0}
    cpus: ${POSTGRES_CPU_LIMIT:-0.0}
    logging: *logging_defaults
    # Override port at runtime to ensure PostgreSQL listens on 5433
    # regardless of what's in postgresql.conf (which only gets set during initdb).
    # Note: The official postgres docker-entrypoint.sh already invokes `exec postgres "$@"`,
    # so we pass only the arguments, not the command itself.
    # The container port is FIXED at 5433; the host port can vary (POSTGRES_PORT) for CI tests.
    command: ["-c", "port=5433"]
    ports:
      - "${POSTGRES_PORT:-5433}:5433"

  pghero:
    <<: *security_defaults
    security_opt:
      - "no-new-privileges:true"
      - "${CORE_DATA_SECCOMP_PGHERO:-seccomp:./seccomp/pghero.json}"
      - "${CORE_DATA_APPARMOR_PGHERO:-apparmor:unconfined}"
    build:
      context: .
      dockerfile: docker/pghero/Dockerfile
    image: ${PGHERO_IMAGE:-ghcr.io/paudley/core_data/pghero:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-core_data}_pghero
    user: "${POSTGRES_UID:-1000}:${POSTGRES_GID:-1000}"
    # group_add adds the secrets group as a supplementary group for reading shared secrets
    group_add:
      - "${SECRETS_GID:-65532}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/opt/core_data/scripts/pghero_entrypoint.sh"]
    environment:
      PGHERO_USERNAME: ${PGHERO_USER}
      PGHERO_PASSWORD: ${PGHERO_PASSWORD}
      PORT: "8080"
      POSTGRES_SUPERUSER: ${POSTGRES_SUPERUSER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      # Container port is always 5433; must be explicit to avoid inheriting random CI port from .env
      POSTGRES_PORT: "5433"
      POSTGRES_SUPERUSER_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      TZ: ${TZ}
    ports:
      - "${PGHERO_PORT}:8080"
    networks:
      - core_data
    volumes:
      - ./secrets/postgres_superuser_password:/run/secrets/postgres_superuser_password:ro
    logging: *logging_defaults

  logical_backup:
    <<: *security_defaults
    security_opt:
      - "no-new-privileges:true"
      - "${CORE_DATA_SECCOMP_LOGICAL_BACKUP:-seccomp:./seccomp/logical_backup.json}"
      - "${CORE_DATA_APPARMOR_LOGICAL_BACKUP:-apparmor:unconfined}"
    image: ${POSTGRES_IMAGE_NAME:-core_data/postgres}:${POSTGRES_IMAGE_TAG:-17.2-bookworm-core}
    container_name: ${COMPOSE_PROJECT_NAME:-core_data}_logical_backup
    restart: unless-stopped
    # group_add adds the secrets group as a supplementary group for reading shared secrets
    group_add:
      - "${SECRETS_GID:-65532}"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/opt/core_data/scripts/logical_backup_runner.sh"]
    environment:
      POSTGRES_HOST: postgres
      # Container port is always 5433; must be explicit to avoid inheriting random CI port from .env
      POSTGRES_PORT: "5433"
      POSTGRES_SUPERUSER: ${POSTGRES_SUPERUSER}
      POSTGRES_SUPERUSER_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      LOGICAL_BACKUP_INTERVAL_SECONDS: ${LOGICAL_BACKUP_INTERVAL_SECONDS}
      LOGICAL_BACKUP_RETENTION_DAYS: ${LOGICAL_BACKUP_RETENTION_DAYS}
      LOGICAL_BACKUP_OUTPUT: ${LOGICAL_BACKUP_OUTPUT}
      TZ: ${TZ}
    volumes:
      - ${BACKUPS_HOST_PATH:-./backups}:/backups
      - ./scripts/logical_backup_runner.sh:/opt/core_data/scripts/logical_backup_runner.sh:ro
      - ./secrets/postgres_superuser_password:/run/secrets/postgres_superuser_password:ro
    networks:
      - core_data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=$(cat /run/secrets/postgres_superuser_password 2>/dev/null) pg_isready -h $${POSTGRES_HOST:-postgres} -p $${POSTGRES_PORT:-5433} -U $${POSTGRES_SUPERUSER:-postgres} -d $${POSTGRES_DB:-postgres}",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging_defaults

  valkey:
    <<: *security_defaults
    security_opt:
      - "no-new-privileges:true"
      - "${CORE_DATA_SECCOMP_VALKEY:-seccomp:./seccomp/valkey.json}"
      - "${CORE_DATA_APPARMOR_VALKEY:-apparmor:unconfined}"
    build:
      context: .
      dockerfile: docker/valkey/Dockerfile
    image: ${VALKEY_IMAGE:-ghcr.io/paudley/core_data/valkey:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-core_data}_valkey
    restart: unless-stopped
    profiles:
      - valkey
    # Run as the valkey user (UID 999) from the valkey image
    # group_add adds the secrets group as a supplementary group for reading shared secrets
    user: "${VALKEY_UID:-999}:${VALKEY_GID:-1000}"
    group_add:
      - "${SECRETS_GID:-65532}"
    environment:
      VALKEY_PORT: ${VALKEY_PORT}
      VALKEY_APPENDONLY: ${VALKEY_APPENDONLY}
      VALKEY_MAXMEMORY: ${VALKEY_MAXMEMORY}
      VALKEY_MAXMEMORY_POLICY: ${VALKEY_MAXMEMORY_POLICY}
      VALKEY_DATABASES: ${VALKEY_DATABASES}
      VALKEY_PASSWORD_FILE: /run/secrets/valkey_password
    entrypoint: ["/opt/core_data/bin/valkey-entrypoint.sh"]
    volumes:
      - ./data/valkey_data:/data
      - ./secrets/valkey_password:/run/secrets/valkey_password:ro
    networks:
      - core_data
    ports:
      - "${VALKEY_HOST_PORT}:${VALKEY_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$(cat /run/secrets/valkey_password) valkey-cli -h 127.0.0.1 -p ${VALKEY_PORT} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging_defaults

  rabbitmq:
    <<: *security_defaults
    security_opt:
      - "no-new-privileges:true"
      - "${CORE_DATA_SECCOMP_RABBITMQ:-seccomp:./seccomp/docker-default.json}"
      - "${CORE_DATA_APPARMOR_RABBITMQ:-apparmor:unconfined}"
    build:
      context: .
      dockerfile: docker/rabbitmq/Dockerfile
    image: ${RABBITMQ_IMAGE:-ghcr.io/paudley/core_data/rabbitmq:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-core_data}_rabbitmq
    restart: unless-stopped
    profiles:
      - rabbitmq
    # group_add adds the secrets group as a supplementary group for reading shared secrets
    user: "${RABBITMQ_UID:-100}:${RABBITMQ_GID:-101}"
    group_add:
      - "${SECRETS_GID:-65532}"
    depends_on:
      volume_prep:
        condition: service_completed_successfully
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS_FILE: /run/secrets/rabbitmq_default_pass
      RABBITMQ_ERLANG_COOKIE_FILE: /run/secrets/rabbitmq_erlang_cookie
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: ${RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS:-}
      TZ: ${TZ}
    entrypoint: ["/opt/core_data/bin/rabbitmq-entrypoint.sh"]
    command: ["rabbitmq-server"]
    volumes:
      - ./data/rabbitmq_data:${RABBITMQ_DATA_MOUNT_PATH:-/var/lib/rabbitmq}
      - ./secrets/rabbitmq_default_pass:/run/secrets/rabbitmq_default_pass:ro
      - ./secrets/rabbitmq_erlang_cookie:/run/secrets/rabbitmq_erlang_cookie:ro
    networks:
      - core_data
    ports:
      - "${RABBITMQ_HOST_PORT}:${RABBITMQ_PORT}"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT}:${RABBITMQ_MANAGEMENT_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "/opt/core_data/bin/rabbitmq-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging_defaults

  pgbouncer:
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
      - "${CORE_DATA_SECCOMP_PGBOUNCER:-seccomp:./seccomp/pgbouncer.json}"
      - "${CORE_DATA_APPARMOR_PGBOUNCER:-apparmor:unconfined}"
    build:
      context: .
      dockerfile: docker/pgbouncer/Dockerfile
    image: ${PGBOUNCER_IMAGE:-ghcr.io/paudley/core_data/pgbouncer:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-core_data}_pgbouncer
    restart: unless-stopped
    profiles:
      - pgbouncer
    # Run as the postgres user (UID 100) from the pgbouncer image
    # group_add adds the secrets group as a supplementary group for reading shared secrets
    user: "${PGBOUNCER_UID:-100}:${PGBOUNCER_GID:-102}"
    group_add:
      - "${SECRETS_GID:-65532}"
    depends_on:
      network_probe:
        condition: service_completed_successfully
      network_guard:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5433"
      PGBOUNCER_PORT: ${PGBOUNCER_PORT:-6432}
      PGBOUNCER_POOL_MODE: ${PGBOUNCER_POOL_MODE}
      PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN}
      PGBOUNCER_DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE}
      PGBOUNCER_RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE}
      PGBOUNCER_RESERVE_POOL_TIMEOUT: ${PGBOUNCER_RESERVE_POOL_TIMEOUT}
      PGBOUNCER_MIN_POOL_SIZE: ${PGBOUNCER_MIN_POOL_SIZE}
      PGBOUNCER_ADMIN_USERS: ${PGBOUNCER_ADMIN_USERS}
      PGBOUNCER_STATS_USERS: ${PGBOUNCER_STATS_USERS}
      PGBOUNCER_STATS_USER: ${PGBOUNCER_STATS_USER}
      PGBOUNCER_AUTH_USER: ${PGBOUNCER_AUTH_USER}
      PGBOUNCER_AUTH_PASSWORD_FILE: /run/secrets/pgbouncer_auth_password
      # Client TLS configuration (SSL for connections TO PgBouncer)
      PGBOUNCER_CLIENT_TLS_SSLMODE: ${PGBOUNCER_CLIENT_TLS_SSLMODE:-require}
      PGBOUNCER_CLIENT_TLS_CERT_FILE: ${PGBOUNCER_CLIENT_TLS_CERT_FILE:-/tmp/pgbouncer/tls/server.crt}
      PGBOUNCER_CLIENT_TLS_KEY_FILE: ${PGBOUNCER_CLIENT_TLS_KEY_FILE:-/tmp/pgbouncer/tls/server.key}
      PGBOUNCER_CLIENT_TLS_SELF_SIGNED_SUBJECT: ${PGBOUNCER_CLIENT_TLS_SELF_SIGNED_SUBJECT:-/CN=core_data_pgbouncer}
      PGBOUNCER_CLIENT_TLS_SELF_SIGNED_DAYS: ${PGBOUNCER_CLIENT_TLS_SELF_SIGNED_DAYS:-730}
      # Transaction mode compatibility (PgBouncer 1.21+)
      PGBOUNCER_MAX_PREPARED_STATEMENTS: ${PGBOUNCER_MAX_PREPARED_STATEMENTS:-1024}
      PGBOUNCER_IGNORE_STARTUP_PARAMETERS: ${PGBOUNCER_IGNORE_STARTUP_PARAMETERS:-extra_float_digits,options}
      PGBOUNCER_TRACK_EXTRA_PARAMETERS: ${PGBOUNCER_TRACK_EXTRA_PARAMETERS:-IntervalStyle}
      PGBOUNCER_APPLICATION_NAME_ADD_HOST: ${PGBOUNCER_APPLICATION_NAME_ADD_HOST:-1}
      # Connection lifecycle
      PGBOUNCER_SERVER_LIFETIME: ${PGBOUNCER_SERVER_LIFETIME:-1800}
      PGBOUNCER_SERVER_IDLE_TIMEOUT: ${PGBOUNCER_SERVER_IDLE_TIMEOUT:-300}
      PGBOUNCER_SERVER_CONNECT_TIMEOUT: ${PGBOUNCER_SERVER_CONNECT_TIMEOUT:-10}
      PGBOUNCER_SERVER_LOGIN_RETRY: ${PGBOUNCER_SERVER_LOGIN_RETRY:-5}
      # Client timeout protection
      PGBOUNCER_QUERY_WAIT_TIMEOUT: ${PGBOUNCER_QUERY_WAIT_TIMEOUT:-30}
      PGBOUNCER_CLIENT_IDLE_TIMEOUT: ${PGBOUNCER_CLIENT_IDLE_TIMEOUT:-3600}
      # DNS failover
      PGBOUNCER_DNS_MAX_TTL: ${PGBOUNCER_DNS_MAX_TTL:-30}
      PGBOUNCER_DNS_NXDOMAIN_TTL: ${PGBOUNCER_DNS_NXDOMAIN_TTL:-5}
    entrypoint: ["/opt/core_data/bin/pgbouncer-entrypoint.sh"]
    volumes:
      - ./secrets/pgbouncer_auth_password:/run/secrets/pgbouncer_auth_password:ro
      - ./secrets/pgbouncer_stats_password:/run/secrets/pgbouncer_stats_password:ro
      - ./network_access:/opt/core_data/network_access:ro
    networks:
      - core_data
    ports:
      # Both host ports map to the same container port - PgBouncer listens once,
      # Docker handles the multi-port exposure
      - "${PGBOUNCER_HOST_PORT:-6432}:${PGBOUNCER_PORT:-6432}"
      - "${PGBOUNCER_EXTRA_HOST_PORT:-5432}:${PGBOUNCER_PORT:-6432}"
    healthcheck:
      test: ["CMD-SHELL", "pgrep pgbouncer >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging_defaults

  memcached:
    <<: *security_defaults
    security_opt:
      - "no-new-privileges:true"
      - "${CORE_DATA_SECCOMP_MEMCACHED:-seccomp:./seccomp/memcached.json}"
      - "${CORE_DATA_APPARMOR_MEMCACHED:-apparmor:unconfined}"
    build:
      context: .
      dockerfile: docker/memcached/Dockerfile
    image: ${MEMCACHED_IMAGE:-ghcr.io/paudley/core_data/memcached:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-core_data}_memcached
    restart: unless-stopped
    profiles:
      - memcached
    command:
      - memcached
      - -m
      - "${MEMCACHED_MEMORY_MB}"
      - -c
      - "${MEMCACHED_MAX_CONNECTIONS}"
      - -t
      - "${MEMCACHED_THREADS}"
      - -o
      - modern
    networks:
      - core_data
    ports:
      - "${MEMCACHED_PORT}:11211"
    healthcheck:
      test: ["CMD-SHELL", "printf 'version\\r\\n' | nc -w 2 127.0.0.1 11211 | grep -qi '^VERSION'"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging_defaults

networks:
  core_data:
    name: ${DOCKER_NETWORK_NAME}
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_NETWORK_SUBNET}
