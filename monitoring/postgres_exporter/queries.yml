pg_stat_activity:
  query: |
    SELECT datname,
           state,
           count(*) AS count,
           COALESCE(EXTRACT(EPOCH FROM max(now() - xact_start)), 0) AS max_tx_duration
      FROM pg_stat_activity
     GROUP BY datname, state;
  metrics:
    - datname:
        usage: "LABEL"
        description: "Database name"
    - state:
        usage: "LABEL"
        description: "Backend state"
    - count:
        usage: "GAUGE"
        description: "Number of backends by database and state"
    - max_tx_duration:
        usage: "GAUGE"
        description: "Maximum transaction age by database and state"
